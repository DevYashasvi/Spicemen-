<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Specimen Match — A Memory Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2EBDD;
    --paper-2:#E8DFCC;
    --ink:#2B2620;
    --rust:#8C2F1B;
    --sage:#4A5D45;
    --brass:#C9A24B;
    --card-back:#5C4A3A;
    --card-back-2:#4A3B2E;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(140,47,27,0.04) 0%, transparent 45%),
      radial-gradient(circle at 80% 75%, rgba(74,93,69,0.05) 0%, transparent 50%);
    font-family:'Inter', sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 16px 60px;
  }

  /* faint paper grain via noise-like layered gradients */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
      repeating-linear-gradient(0deg, rgba(43,38,32,0.015) 0px, transparent 1px, transparent 2px),
      repeating-linear-gradient(90deg, rgba(43,38,32,0.015) 0px, transparent 1px, transparent 2px);
    z-index:0;
  }

  .header{
    text-align:center;
    margin-bottom:6px;
    z-index:1;
    max-width:480px;
  }

  .eyebrow{
    font-family:'Inter', sans-serif;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--rust);
    font-weight:600;
    margin:0 0 8px;
  }

  h1{
    font-family:'Crimson Pro', serif;
    font-weight:700;
    font-size:clamp(32px, 6vw, 44px);
    margin:0 0 6px;
    letter-spacing:0.01em;
  }

  .subtitle{
    font-family:'Crimson Pro', serif;
    font-style:italic;
    font-size:15px;
    color:#5c5347;
    margin:0 0 26px;
  }

  .stats-bar{
    display:flex;
    gap:28px;
    align-items:center;
    justify-content:center;
    margin-bottom:28px;
    flex-wrap:wrap;
    z-index:1;
  }

  .stat{
    text-align:center;
  }

  .stat-label{
    font-size:10px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#8a7f6e;
    font-weight:600;
    margin:0 0 2px;
  }

  .stat-value{
    font-family:'Crimson Pro', serif;
    font-size:22px;
    font-weight:600;
    color:var(--ink);
    margin:0;
  }

  .divider-dot{
    width:4px;
    height:4px;
    border-radius:50%;
    background:var(--brass);
  }

  .reset-btn{
    font-family:'Inter', sans-serif;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.04em;
    background:transparent;
    border:1.5px solid var(--ink);
    color:var(--ink);
    padding:7px 16px;
    border-radius:3px;
    cursor:pointer;
    transition:background 0.15s, color 0.15s;
  }
  .reset-btn:hover{
    background:var(--ink);
    color:var(--paper);
  }
  .reset-btn:focus-visible{
    outline:2px solid var(--rust);
    outline-offset:2px;
  }

  .tray{
    background:var(--paper-2);
    border:1px solid rgba(43,38,32,0.12);
    border-radius:6px;
    padding:20px;
    box-shadow:
      0 1px 2px rgba(43,38,32,0.06),
      0 12px 28px rgba(43,38,32,0.10),
      inset 0 0 0 1px rgba(255,255,255,0.3);
    z-index:1;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:12px;
    width:min(420px, 84vw);
  }

  .card{
    aspect-ratio:3/4;
    position:relative;
    cursor:pointer;
    perspective:600px;
    -webkit-tap-highlight-color:transparent;
  }

  .card-inner{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition:transform 0.45s cubic-bezier(.2,.7,.3,1);
  }

  .card.flipped .card-inner{
    transform:rotateY(180deg);
  }

  .card-face{
    position:absolute;
    inset:0;
    border-radius:5px;
    display:flex;
    align-items:center;
    justify-content:center;
    backface-visibility:hidden;
  }

  .card-back{
    background:
      linear-gradient(135deg, var(--card-back) 0%, var(--card-back-2) 100%);
    border:1px solid rgba(0,0,0,0.25);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.06);
  }

  .card-back::before{
    content:"";
    width:34%;
    height:34%;
    border:1.5px solid var(--brass);
    border-radius:50%;
    opacity:0.55;
  }
  .card-back::after{
    content:"✦";
    position:absolute;
    color:var(--brass);
    opacity:0.55;
    font-size:14px;
  }

  .card-front{
    background:var(--paper);
    border:1px solid rgba(43,38,32,0.18);
    transform:rotateY(180deg);
    flex-direction:column;
    gap:6px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.4);
  }

  .card-front .icon{
    font-size:clamp(26px, 6vw, 34px);
    line-height:1;
    filter:sepia(0.15);
  }

  .card-front .label{
    font-family:'Inter', sans-serif;
    font-size:8px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:#8a7f6e;
    font-weight:600;
  }

  .card.matched .card-front{
    background:var(--paper);
    border-color:var(--sage);
  }

  .card.matched .card-front::after{
    content:"";
    position:absolute;
    top:6px;
    right:6px;
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--rust);
    box-shadow:0 0 0 2px rgba(140,47,27,0.18);
  }

  /* ink-stamp reveal animation */
  @keyframes stampIn{
    0%{ transform:rotateY(180deg) scale(0.85); opacity:0; }
    60%{ transform:rotateY(180deg) scale(1.06); opacity:1; }
    100%{ transform:rotateY(180deg) scale(1); opacity:1; }
  }
  .card.flipped .card-front{
    animation:stampIn 0.32s ease-out 0.18s both;
  }

  .card.shake .card-inner{
    animation:shake 0.4s ease;
  }
  @keyframes shake{
    0%, 100%{ transform:rotateY(180deg) translateX(0); }
    25%{ transform:rotateY(180deg) translateX(-4px); }
    75%{ transform:rotateY(180deg) translateX(4px); }
  }

  .card:focus-visible .card-inner{
    outline:2px solid var(--rust);
    outline-offset:3px;
    border-radius:5px;
  }

  .win-banner{
    margin-top:22px;
    text-align:center;
    z-index:1;
    max-width:380px;
  }

  .win-banner.hidden{ display:none; }

  .win-banner .stamp{
    display:inline-block;
    font-family:'Crimson Pro', serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--rust);
    border:2px solid var(--rust);
    border-radius:4px;
    padding:6px 14px;
    transform:rotate(-2deg);
    margin-bottom:10px;
  }

  .win-banner p{
    font-family:'Crimson Pro', serif;
    font-style:italic;
    font-size:14px;
    color:#5c5347;
    margin:0;
  }

  @media (prefers-reduced-motion: reduce){
    .card-inner, .card.flipped .card-front, .card.shake .card-inner{
      animation:none !important;
      transition:transform 0.01s linear;
    }
  }

  @media (max-width:380px){
    .grid{ gap:8px; }
    .stats-bar{ gap:18px; }
  }
</style>
</head>
<body>

  <div class="header">
    <p class="eyebrow">Cabinet of Curiosities, No. 14</p>
    <h1>Specimen Match</h1>
    <p class="subtitle">Eight pairs, catalogued somewhere in this tray. Find them all.</p>
  </div>

  <div class="stats-bar">
    <div class="stat">
      <p class="stat-label">Moves</p>
      <p class="stat-value" id="moves">0</p>
    </div>
    <div class="divider-dot"></div>
    <div class="stat">
      <p class="stat-label">Found</p>
      <p class="stat-value" id="found">0 / 8</p>
    </div>
    <div class="divider-dot"></div>
    <div class="stat">
      <p class="stat-label">Time</p>
      <p class="stat-value" id="time">0:00</p>
    </div>
    <button class="reset-btn" id="resetBtn">New Tray</button>
  </div>

  <div class="tray">
    <div class="grid" id="grid"></div>
  </div>

  <div class="win-banner hidden" id="winBanner">
    <div class="stamp">Fully Catalogued</div>
    <p id="winDetail">Every specimen found.</p>
  </div>

<script>
(function(){
  const SPECIMENS = [
    {icon:"🧭", label:"Compass"},
    {icon:"🗝️", label:"Key"},
    {icon:"🦋", label:"Moth"},
    {icon:"⏳", label:"Hourglass"},
    {icon:"🐚", label:"Shell"},
    {icon:"🕯️", label:"Candle"},
    {icon:"🔭", label:"Scope"},
    {icon:"🍄", label:"Fungus"}
  ];

  const grid = document.getElementById('grid');
  const movesEl = document.getElementById('moves');
  const foundEl = document.getElementById('found');
  const timeEl = document.getElementById('time');
  const winBanner = document.getElementById('winBanner');
  const winDetail = document.getElementById('winDetail');
  const resetBtn = document.getElementById('resetBtn');

  let cards = [];
  let flipped = [];
  let matchedCount = 0;
  let moves = 0;
  let lockBoard = false;
  let timerInterval = null;
  let seconds = 0;
  let started = false;

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function formatTime(s){
    const m = Math.floor(s / 60);
    const r = s % 60;
    return m + ":" + String(r).padStart(2, '0');
  }

  function startTimerIfNeeded(){
    if(started) return;
    started = true;
    timerInterval = setInterval(() => {
      seconds++;
      timeEl.textContent = formatTime(seconds);
    }, 1000);
  }

  function stopTimer(){
    clearInterval(timerInterval);
    started = false;
  }

  function buildDeck(){
    const deck = shuffle([...SPECIMENS, ...SPECIMENS].map((s, i) => ({...s, uid: i})));
    return deck;
  }

  function render(){
    grid.innerHTML = '';
    cards = buildDeck();
    cards.forEach((card, idx) => {
      const el = document.createElement('div');
      el.className = 'card';
      el.setAttribute('role', 'button');
      el.setAttribute('tabindex', '0');
      el.setAttribute('aria-label', 'Hidden specimen card');
      el.dataset.index = idx;

      el.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-back"></div>
          <div class="card-face card-front">
            <span class="icon">${card.icon}</span>
            <span class="label">${card.label}</span>
          </div>
        </div>
      `;

      el.addEventListener('click', () => handleFlip(idx, el));
      el.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' || e.key === ' '){
          e.preventDefault();
          handleFlip(idx, el);
        }
      });

      grid.appendChild(el);
    });
  }

  function handleFlip(idx, el){
    if(lockBoard) return;
    if(el.classList.contains('flipped') || el.classList.contains('matched')) return;
    if(flipped.length === 2) return;

    startTimerIfNeeded();

    el.classList.add('flipped');
    el.setAttribute('aria-label', cards[idx].label + ' specimen, revealed');
    flipped.push({idx, el});

    if(flipped.length === 2){
      moves++;
      movesEl.textContent = moves;
      lockBoard = true;

      const [a, b] = flipped;
      const isMatch = cards[a.idx].uid % SPECIMENS.length === cards[b.idx].uid % SPECIMENS.length ||
                       cards[a.idx].icon === cards[b.idx].icon;

      if(isMatch){
        setTimeout(() => {
          a.el.classList.add('matched');
          b.el.classList.add('matched');
          matchedCount++;
          foundEl.textContent = matchedCount + ' / 8';
          flipped = [];
          lockBoard = false;

          if(matchedCount === SPECIMENS.length){
            finishGame();
          }
        }, 380);
      } else {
        setTimeout(() => {
          a.el.classList.add('shake');
          b.el.classList.add('shake');
        }, 380);
        setTimeout(() => {
          a.el.classList.remove('flipped', 'shake');
          b.el.classList.remove('flipped', 'shake');
          a.el.setAttribute('aria-label', 'Hidden specimen card');
          b.el.setAttribute('aria-label', 'Hidden specimen card');
          flipped = [];
          lockBoard = false;
        }, 900);
      }
    }
  }

  function finishGame(){
    stopTimer();
    winDetail.textContent = `Found in ${moves} moves, ${formatTime(seconds)}.`;
    winBanner.classList.remove('hidden');
  }

  function resetGame(){
    stopTimer();
    seconds = 0;
    moves = 0;
    matchedCount = 0;
    flipped = [];
    lockBoard = false;
    movesEl.textContent = '0';
    foundEl.textContent = '0 / 8';
    timeEl.textContent = '0:00';
    winBanner.classList.add('hidden');
    render();
  }

  resetBtn.addEventListener('click', resetGame);

  render();
})();
</script>

</body>
</html>
